replicaCount: 1

image:
  repository: "github.com/dxas90/mesh"
  pullPolicy: "Always"
  tag: "latest"

service:
  type: "ClusterIP"
  port: 8080
  annotations: {}

chart_label: "mesh"

namespace: "default"

httproute:
  enabled: false
  gatewayName: "gateway"
  gatewayNamespace: "gateway-system"
  sectionName: "http"
  annotations: {}
    # external-dns.alpha.kubernetes.io/target: "gateway.example.com"
  labels: {}
    # use-cloudflare-solver: "true"
  hostnames:
    - "example.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - port: 8080

persistence:
  enabled: false
  capacity: "8Mi"
  mountPath: "/data"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 512Mi

# Environment configuration
env:
  # Environment variables from file will be loaded here during chart generation
  # if env_file_path is provided in cookiecutter.json
  variables:
    APP_ENV: "production"
    TMPDIR: "/tmp"

# Environment configuration as a config map
# Extra environment variables that will be included in the ConfigMap and injected
# into the container via envFrom. Useful for setting JVM options when root FS is
# mounted read-only (for example: override go.io.tmpdir to a writable emptyDir)
extraEnv:
  PORT: "8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "tempo.observability.svc.cluster.local:4317"
  LEARN_GO_SERVICE_URL: "http://learn-go.playground.svc.cluster.local:8001"
  LEARN_PYTHON_SERVICE_URL: "http://learn-python.playground.svc.cluster.local:8000"
  LEARN_RUST_SERVICE_URL: "http://learn-rust.playground.svc.cluster.local:8080"
  REDIS_URL: "redis://redis.playground.svc.cluster.local:6379/0"
  REDIS_ENABLED: "false"

# Extra secrets that will be included in the Secret and injected
extraSecrets: []

# Common secret and settings references
common:
  secrets:
    enabled: false
    name: "common-secrets"
  settings:
    enabled: false
    name: "common-settings"

# Other values from the original chart are intentionally left as defaults.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Added to the deployment spec template
imagePullSecrets: []

podSecurityContext:
  # Aligns with the node user in Node.js image (gid: 1000)
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

livenessProbe:
  httpGet:
    path: /graphql?query=%7Bhealth%7Bstatus%7D%7D
    port: http
  initialDelaySeconds: 180
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 10

readinessProbe:
  httpGet:
    path: /graphql?query=%7Bhealth%7Bstatus%7D%7D
    port: http
  initialDelaySeconds: 180
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 10

volumeMounts:
  - name: app-cache
    mountPath: /tmp/mesh/cache

volumes:
  - name: app-cache
    emptyDir: {}

# Database configuration (CNPG Database resource) to create the database
database:
  enabled: false
  name: "mesh"
  owner: "app"
  clusterName: "postgres"

dapr:
  enabled: false
