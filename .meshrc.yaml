---
# yaml-language-server: $schema=https://unpkg.com/@graphql-mesh/types@0.104.18/esm/config-schema.json
# GraphQL Mesh Configuration
# Replaces Python BFF-Web with unified GraphQL gateway

sources:
  - name: LearnGo
    handler:
      openapi:
        source: "${LEARN_GO_SERVICE_URL}/openapi.json"
        endpoint: "${LEARN_GO_SERVICE_URL}"
        operationHeaders:
          x-user-id: "{context.headers.x-user-id}"
          x-service: "learn-go"
    transforms:
      - prefix:
          value: "go_"
          includeRootOperations: true

  - name: LearnPython
    handler:
      openapi:
        source: "${LEARN_PYTHON_SERVICE_URL}/openapi.json"
        endpoint: "${LEARN_PYTHON_SERVICE_URL}"
        operationHeaders:
          x-user-id: "{context.headers.x-user-id}"
          x-service: "learn-python"
    transforms:
      - prefix:
          value: "python_"
          includeRootOperations: true

  - name: LearnRust
    handler:
      openapi:
        source: "${LEARN_RUST_SERVICE_URL}/openapi.json"
        endpoint: "${LEARN_RUST_SERVICE_URL}"
        operationHeaders:
          x-user-id: "{context.headers.x-user-id}"
          x-service: "learn-rust"
    transforms:
      - prefix:
          value: "rust_"
          includeRootOperations: true

# Cache configuration (Redis)
cache:
  redis:
    url: ${REDIS_URL:redis://localhost:6379/0}

# Server configuration
serve:
  port: 8080
  endpoint: /graphql
  playground: true
  cors:
    origin: "${env.CORS_ORIGINS:*}"
    credentials: true
