---
    name: Validate Mesh Configuration on PR
    on:
      pull_request:
        branches: [ main ]
    jobs:
      validate:
        name: Validate Mesh Configuration
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Install pnpm
            uses: pnpm/action-setup@v4

          - name: Setup Node.js
            uses: actions/setup-node@v6
            with:
              node-version-file: '.nvmrc'
              cache: "pnpm"

          - name: Install dependencies
            run: pnpm install --frozen-lockfile

          - name: Build and validate mesh configuration
            run: pnpm build

      test:
        name: Build Mesh Gateway
        runs-on: ubuntu-latest
        strategy:
          matrix:
            node-version: [20, 22, 24]
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Install pnpm
            uses: pnpm/action-setup@v4

          - name: Setup Node.js ${{ matrix.node-version }}
            uses: actions/setup-node@v6
            with:
              node-version: ${{ matrix.node-version }}
              cache: "pnpm"

          - name: Install dependencies
            run: pnpm install --frozen-lockfile

          - name: Build GraphQL Mesh
            run: pnpm build

      security-scan:
        name: Security Vulnerability Scan
        runs-on: ubuntu-latest
        needs: test
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup Node.js
            uses: actions/setup-node@v6
            with:
              node-version-file: '.nvmrc'
              cache: "pnpm"

          - name: Install pnpm
            uses: pnpm/action-setup@v4

          - name: Install dependencies
            run: pnpm install --frozen-lockfile

          - name: Run pnpm audit
            run: pnpm audit --audit-level=high
            continue-on-error: true
